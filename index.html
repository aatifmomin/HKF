<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport. user-scalable=no makes input focus stable on
       iOS Safari (no autozoom into form fields). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0E2046" />
  <title>Hasnain Karimain Foundation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Initial loading state — replaced by app.js once Firebase initialises -->
    <div class="shell">
      <div class="loading">
        <div class="spinner"></div>
        Loading…
      </div>
    </div>
  </div>

  <!-- ES module so we can use import/export. Modern browsers (Chrome 61+,
       Safari 11+, Firefox 60+) support this natively. -->
  <script type="module" src="app.js?v=2026-09-02a"></script>
</body>
</html>
